services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: semptify
      POSTGRES_USER: semptify
      POSTGRES_PASSWORD: semptify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semptify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
